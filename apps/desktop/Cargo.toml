[package]
name = "opencut-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "opencut"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
anyhow = "1.0"
image = "0.25"
smallvec = "1.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
